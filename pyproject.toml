[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
name = "debian-policy-checker"
version = "0.1.4"
description = "GTK4 Debian Policy Manual validator with fix suggestions"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{name = "Daniel Nylander", email = "daniel@danielnylander.se"}]

[project.scripts]
debian-policy-checker = "debian_policy_checker.main:main"

[tool.setuptools.packages.find]
where = ["src"]
